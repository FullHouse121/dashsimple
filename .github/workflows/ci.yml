name: CI
on:
  # Every branch, deliberately. The old allow-list (main, ux/**, feat/**,
  # fix/**) silently skipped anything named differently — design/** work
  # went 115 commits without a lint run and shipped a rules-of-hooks error.
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Server syntax
        run: node --check server/index.js
      - name: Unit tests (scoping + auth boundaries)
        run: npx vitest run
      - name: Frontend build
        run: npm run build
